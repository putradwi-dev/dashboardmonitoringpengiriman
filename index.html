<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoring Pengiriman Pesanan - PT. MBP</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/putradwi-dev/dashboardmonitoringpengiriman/main/favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            .no-print { display: none !important; }
            body { background-color: white !important; }
        }
    </style>
</head>
<body class="bg-[#faf7f2] text-stone-800 min-h-screen pb-16">

    <!-- Header -->
    <header class="bg-amber-950 text-amber-50 shadow-md sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-4 flex flex-col sm:flex-row items-center justify-between gap-2">
            <div>
                <h1 class="font-extrabold text-lg sm:text-xl tracking-tight">Monitoring Pengiriman Pesanan Titip Proses PT. MBP</h1>
                <p id="lastUpdatedText" class="text-xs text-amber-200/80 font-medium mt-0.5">Memuat data terbaru...</p>
            </div>
            <div class="flex items-center gap-2 no-print">
                <button onclick="loadData()" class="bg-amber-800 hover:bg-amber-700 text-amber-50 font-bold px-3.5 py-2 rounded-xl text-xs transition-all shadow-sm flex items-center gap-1.5">
                    🔄 Refresh Data
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-6 space-y-8">
        <!-- Kotak Pencarian & Filter -->
        <div class="bg-white p-4 rounded-2xl border border-amber-100 shadow-sm flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 no-print">
            <div class="w-full md:w-96">
                <input type="text" id="searchInput" oninput="filterData()" placeholder="🔍 Cari nama barang, no. pesanan, atau toko..." class="w-full bg-[#faf7f2] border border-amber-200 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-stone-800 focus:ring-2 focus:ring-amber-800 focus:outline-none">
            </div>
            <div class="flex flex-wrap items-center gap-2 text-xs font-bold">
                <span class="px-3 py-1.5 rounded-lg bg-amber-50 text-amber-900 border border-amber-200" id="totalOrdersBadge">Total Pesanan: 0</span>
                <span class="px-3 py-1.5 rounded-lg bg-emerald-50 text-emerald-900 border border-emerald-200" id="totalStokBadge">Item Stok Titipan: 0</span>
            </div>
        </div>

        <!-- SECTION 1: DATA PESANAN BELUM KIRIM -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="font-extrabold text-stone-900 text-lg sm:text-xl flex items-center gap-2">
                    📦 Daftar Pesanan Belum Kirim
                </h2>
            </div>

            <div id="belumKirimContainer" class="space-y-8">
                <!-- Kontainer per tanggal dan tabel e-commerce dirender secara dinamis -->
            </div>
        </section>

        <!-- SECTION 2: DATA STOK TANGERANG TITIP DI PT. MBG -->
        <section class="bg-white p-5 sm:p-6 rounded-3xl border-2 border-stone-800 shadow-sm space-y-4">
            <div class="flex items-center justify-between border-b-2 border-stone-200 pb-3">
                <h2 class="font-extrabold text-stone-900 text-base sm:text-lg flex items-center gap-2">
                    🏭 Data Stok Tangerang Titip di PT. MBG
                </h2>
            </div>

            <div class="overflow-x-auto rounded-2xl border border-amber-100">
                <table class="w-full text-left text-xs sm:text-sm">
                    <thead class="bg-[#faf7f2] font-bold text-stone-700 uppercase border-b border-amber-100 text-xs">
                        <tr>
                            <th class="py-3.5 px-4">Nama Barang</th>
                            <th class="py-3.5 px-4 text-center w-24">QTY</th>
                            <th class="py-3.5 px-4">Status / Catatan</th>
                        </tr>
                    </thead>
                    <tbody id="stokContainer" class="divide-y divide-amber-50 bg-white">
                        <!-- Items Stok dirender secara dinamis -->
                    </tbody>
                </table>
            </div>
        </section>
    </main>

    <footer class="max-w-6xl mx-auto px-4 mt-12 text-center text-xs text-stone-400 font-medium">
        Dashboard Monitoring Pengiriman & Stok Titipan • PT. MBP
    </footer>

    <script>
        let appData = {
            belum_kirim: [],
            stok_tangerang: []
        };

        // URL raw data.json dari GitHub repository Anda
        const DATA_URL = "https://raw.githubusercontent.com/putradwi-dev/dashboardmonitoringpengiriman/main/data.json";

        window.onload = function() {
            loadData();
        };

        async function loadData() {
            const statusText = document.getElementById('lastUpdatedText');
            statusText.innerText = "Memuat data terbaru...";
            try {
                // Tambahkan timestamp untuk mencegah cache browser
                const response = await fetch(`${DATA_URL}?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Gagal memuat data.json");
                appData = await response.json();

                const now = new Date();
                statusText.innerText = `Terakhir diperbarui: ${now.toLocaleDateString('id-ID')} pukul ${now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit' })}`;
                
                renderAll();
            } catch (error) {
                console.error(error);
                statusText.innerText = "⚠️ Gagal memuat data terbaru.";
            }
        }

        function renderAll() {
            renderBelumKirim();
            renderStok();
        }

        function filterData() {
            renderBelumKirim();
            renderStok();
        }

        function extractDateFromGroup(grupStr) {
            const match = (grupStr || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (match) {
                const [, d, m, y] = match;
                return new Date(`${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`).getTime();
            }
            return 0;
        }

        function getStoreBadgeHtml(grupName) {
            const upper = (grupName || '').toUpperCase();
            if (upper.includes('SHOPE')) {
                return `<img src="https://raw.githubusercontent.com/putradwi-dev/dashboardmonitoringpengiriman/main/shopee.png" alt="Shopee" class="h-5 w-5 object-contain rounded" onerror="this.style.display='none'">`;
            } else if (upper.includes('TOKOPEDIA')) {
                return `<img src="https://raw.githubusercontent.com/putradwi-dev/dashboardmonitoringpengiriman/main/tokopedia.png" alt="Tokopedia" class="h-5 w-5 object-contain rounded" onerror="this.style.display='none'">`;
            } else if (upper.includes('OFFLINE')) {
                return `<span class="w-3.5 h-3.5 rounded-full bg-amber-700 inline-block"></span>`;
            }
            return `<span class="w-3.5 h-3.5 rounded-full bg-stone-600 inline-block"></span>`;
        }

        function getEkspedisiBadgeHtml(eks) {
            const val = (eks || '').toUpperCase();
            if (val === 'JNE') {
                return `<span class="inline-flex items-center gap-1.5 bg-blue-50 text-blue-800 border border-blue-200 px-2.5 py-1 rounded-lg font-extrabold text-xs">
                            <img src="https://raw.githubusercontent.com/putradwi-dev/dashboardmonitoringpengiriman/main/jne.png" alt="JNE" class="h-3.5 object-contain" onerror="this.style.display='none'"> JNE
                        </span>`;
            } else if (val === 'J&T') {
                return `<span class="inline-flex items-center gap-1.5 bg-red-50 text-red-800 border border-red-200 px-2.5 py-1 rounded-lg font-extrabold text-xs">
                            <img src="https://raw.githubusercontent.com/putradwi-dev/dashboardmonitoringpengiriman/main/jnt.png" alt="J&T" class="h-3.5 object-contain" onerror="this.style.display='none'"> J&T
                        </span>`;
            } else if (val === 'KURIR TOKO') {
                return `<span class="inline-flex items-center gap-1.5 bg-rose-50 text-rose-800 border border-rose-200 px-2.5 py-1 rounded-lg font-extrabold text-xs">
                            KURIR TOKO
                        </span>`;
            }
            return `<span class="inline-flex items-center bg-stone-100 text-stone-800 border border-stone-200 px-2.5 py-1 rounded-lg font-extrabold text-xs">${val || '-'}</span>`;
        }

        function renderBelumKirim() {
            const container = document.getElementById('belumKirimContainer');
            container.innerHTML = '';

            const groups = appData.belum_kirim || [];
            const keyword = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

            // Urutkan dari tanggal tua ke muda (pertahankan urutan manual admin jika tanggal sama)
            const sortedGroups = groups.map((g, idx) => ({ g, idx })).sort((a, b) => {
                const diff = extractDateFromGroup(a.g.grup) - extractDateFromGroup(b.g.grup);
                return diff !== 0 ? diff : a.idx - b.idx;
            }).map(item => item.g);

            let totalOrdersCount = 0;
            let lastDateStr = '';
            let currentWrapper = null;
            let currentStoreCardsWrapper = null;

            sortedGroups.forEach(group => {
                const items = group.items || [];
                const filteredItems = items.filter(item => {
                    if (!keyword) return true;
                    const nama = (item.nama || '').toLowerCase();
                    const no = (item.no_pesanan || '').toLowerCase();
                    const grup = (group.grup || '').toLowerCase();
                    const cat = (item.catatan_manual || '').toLowerCase();
                    return nama.includes(keyword) || no.includes(keyword) || grup.includes(keyword) || cat.includes(keyword);
                });

                if (filteredItems.length === 0) return;
                totalOrdersCount += filteredItems.length;

                const dateMatch = (group.grup || '').match(/(\d{1,2}\/\d{1,2}\/\d{4})/);
                const currentDateStr = dateMatch ? dateMatch[1] : 'TANPA TANGGAL';

                // Buat wadah kontainer besar yang menyatukan label tanggal dengan semua tabel e-commerce di tanggal tersebut
                if (currentDateStr !== lastDateStr) {
                    lastDateStr = currentDateStr;

                    currentWrapper = document.createElement('div');
                    currentWrapper.className = "bg-white rounded-3xl border-2 border-stone-900 shadow-sm overflow-hidden";

                    currentWrapper.innerHTML = `
                        <div class="bg-stone-900 text-amber-50 px-5 py-3.5 flex items-center justify-between">
                            <div class="flex items-center gap-2.5 text-sm sm:text-base font-extrabold tracking-wide uppercase">
                                <span>📅 TANGGAL PESANAN MASUK: ${currentDateStr}</span>
                            </div>
                        </div>
                        <div class="p-4 sm:p-5 space-y-5 store-cards-wrapper bg-white"></div>
                    `;
                    container.appendChild(currentWrapper);
                    currentStoreCardsWrapper = currentWrapper.querySelector('.store-cards-wrapper');
                }

                // Render tabel e-commerce di dalam wadah tanggal tersebut
                const isOffline = (group.grup || '').toUpperCase().includes('OFFLINE');
                let rowsHtml = '';

                filteredItems.forEach(item => {
                    let badges = [];
                    if (item.kayu) {
                        badges.push(`<span class="bg-amber-100 text-amber-900 border border-amber-300 px-2.5 py-0.5 rounded-md font-extrabold text-[11px]">PACKING KAYU</span>`);
                    }
                    if (item.terlambat) {
                        badges.push(`<span class="bg-red-100 text-red-700 border border-red-300 px-2.5 py-0.5 rounded-md font-extrabold text-[11px] animate-pulse">TERLAMBAT</span>`);
                    }
                    if (item.batal) {
                        badges.push(`<span class="bg-orange-100 text-orange-800 border border-orange-300 px-2.5 py-0.5 rounded-md font-extrabold text-[11px]">MIB (MALAM INI BATAL)</span>`);
                    }
                    if (item.catatan_manual && item.catatan_manual.trim() !== '') {
                        badges.push(`<span class="bg-sky-50 text-sky-800 border border-sky-200 px-2.5 py-0.5 rounded-md font-bold text-[11px]">${item.catatan_manual}</span>`);
                    }

                    const statusHtml = badges.length > 0 ? `<div class="flex flex-wrap gap-1.5">${badges.join('')}</div>` : `<span class="text-stone-400 text-xs font-medium">-</span>`;

                    rowsHtml += `
                        <tr class="hover:bg-amber-50/40 transition-colors">
                            <td class="py-3.5 px-4 font-extrabold text-stone-900">${item.nama || '-'}</td>
                            <td class="py-3.5 px-4 font-mono font-bold text-stone-700">${item.no_pesanan || '-'}</td>
                            <td class="py-3.5 px-4 text-center">
                                <span class="inline-block bg-amber-100/80 text-amber-950 border border-amber-300 font-extrabold px-2.5 py-0.5 rounded-lg text-xs">${item.qty || 1}</span>
                            </td>
                            <td class="py-3.5 px-4">${getEkspedisiBadgeHtml(item.ekspedisi)}</td>
                            <td class="py-3.5 px-4">${statusHtml}</td>
                        </tr>
                    `;
                });

                const storeCard = document.createElement('div');
                storeCard.className = "bg-[#faf7f2] rounded-2xl border border-amber-200/90 p-4 sm:p-5 space-y-3.5 shadow-sm";
                storeCard.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between gap-2">
                        <div class="flex items-center gap-2.5">
                            ${getStoreBadgeHtml(group.grup)}
                            <h3 class="font-extrabold text-amber-950 text-base sm:text-lg tracking-tight uppercase">${group.grup}</h3>
                            <span class="bg-amber-100 text-amber-900 border border-amber-200 text-xs font-bold px-2.5 py-0.5 rounded-full">
                                ${filteredItems.length} Pesanan
                            </span>
                        </div>
                        ${isOffline ? `<span class="text-xs font-extrabold text-cyan-800 tracking-wider uppercase text-right">TRANSAKSI<br class="hidden sm:inline"> OFFLINE</span>` : ''}
                    </div>

                    <div class="overflow-x-auto rounded-xl border border-amber-200/70 bg-white">
                        <table class="w-full text-left text-xs sm:text-sm">
                            <thead class="bg-[#fdfbf7] font-bold text-stone-500 uppercase border-b border-amber-100 text-[11px] tracking-wider">
                                <tr>
                                    <th class="py-3 px-4 w-1/4">Nama Barang</th>
                                    <th class="py-3 px-4 w-1/4">Nomor Pesanan</th>
                                    <th class="py-3 px-4 text-center w-16">QTY</th>
                                    <th class="py-3 px-4 w-36">Ekspedisi</th>
                                    <th class="py-3 px-4">Status / Catatan</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-amber-50">
                                ${rowsHtml}
                            </tbody>
                        </table>
                    </div>
                `;

                currentStoreCardsWrapper.appendChild(storeCard);
            });

            document.getElementById('totalOrdersBadge').innerText = `Total Pesanan: ${totalOrdersCount}`;

            if (totalOrdersCount === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-2xl border border-amber-100 text-center text-stone-500 font-semibold text-sm">
                        Tidak ada data pesanan yang ditemukan.
                    </div>
                `;
            }
        }

        function renderStok() {
            const container = document.getElementById('stokContainer');
            container.innerHTML = '';

            const stokList = appData.stok_tangerang || [];
            const keyword = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();

            let visibleCount = 0;

            stokList.forEach(item => {
                const nama = (item.nama || '').toLowerCase();
                const catatan = (item.catatan || '').toLowerCase();

                if (keyword && !nama.includes(keyword) && !catatan.includes(keyword)) return;
                visibleCount++;

                let statusBadge = '';
                if (item.tipe === 'priority') {
                    statusBadge = `<span class="bg-emerald-100 text-emerald-800 border border-emerald-300 px-2.5 py-0.5 rounded-md font-extrabold text-[11px] mr-1.5">UTAMAKAN HABISKAN INI</span>`;
                } else if (item.tipe === 'warning') {
                    statusBadge = `<span class="bg-amber-100 text-amber-800 border border-amber-300 px-2.5 py-0.5 rounded-md font-extrabold text-[11px] mr-1.5">PERLU DIPERBAIKI</span>`;
                }

                const catatanText = (item.catatan && item.catatan !== '-') ? `<span class="font-semibold text-stone-700">${item.catatan}</span>` : `<span class="text-stone-400">-</span>`;

                const tr = document.createElement('tr');
                tr.className = "hover:bg-[#faf7f2] transition-colors";
                tr.innerHTML = `
                    <td class="py-3.5 px-4 font-extrabold text-stone-900">${item.nama || '-'}</td>
                    <td class="py-3.5 px-4 text-center">
                        <span class="inline-block bg-emerald-50 text-emerald-900 border border-emerald-200 font-extrabold px-3 py-0.5 rounded-lg text-xs">${item.jumlah || 0}</span>
                    </td>
                    <td class="py-3.5 px-4">${statusBadge}${catatanText}</td>
                `;
                container.appendChild(tr);
            });

            document.getElementById('totalStokBadge').innerText = `Item Stok Titipan: ${visibleCount}`;

            if (visibleCount === 0) {
                container.innerHTML = `
                    <tr>
                        <td colspan="3" class="py-6 text-center text-stone-400 font-semibold text-xs">Tidak ada data stok titipan yang cocok.</td>
                    </tr>
                `;
            }
        }
    </script>
</body>
</html>
