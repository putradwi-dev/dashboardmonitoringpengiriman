<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Input Data Pengiriman - PT. MBP</title>
    <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/putradwi-dev/dashboardmonitoringpengiriman/main/favicon.png">
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-[#faf7f2] text-stone-800 min-h-screen pb-16">

    <!-- Header Admin -->
    <header class="bg-amber-950 text-amber-50 shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <h1 class="font-extrabold text-lg sm:text-xl">Input Data Pengiriman Pesanan Titip Proses PT. MBP</h1>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 mt-6 space-y-6">
        <!-- Tombol Aksi Utama & Kotak Pencarian -->
        <div class="flex flex-col md:flex-row items-stretch md:items-center justify-between gap-3 bg-white p-4 rounded-2xl border border-amber-100 shadow-sm">
            <div class="flex items-center gap-3">
                <button onclick="saveToGitHub()" class="bg-cyan-700 hover:bg-cyan-800 text-white font-bold px-5 py-2.5 rounded-xl text-sm transition-all flex items-center gap-2 shadow-md">
                    SIMPAN & UPDATE
                </button>
                <div id="globalDuplicateWarning" class="hidden bg-red-100 border border-red-300 text-red-700 px-3 py-1.5 rounded-lg text-xs font-bold animate-pulse">
                    ⚠️ Peringatan: Duplikat!
                </div>
            </div>
            <!-- Kotak Pencarian Universal -->
            <div class="w-full md:w-80">
                <input type="text" id="searchInput" oninput="filterData()" placeholder="🔍 Cari pesanan atau nama barang..." class="w-full bg-[#faf7f2] border border-amber-200 rounded-xl px-3.5 py-2.5 text-sm font-semibold text-stone-800 focus:ring-2 focus:ring-amber-800 focus:outline-none">
            </div>
        </div>

        <!-- SECTION 1: EDIT KATEGORI BELUM KIRIM -->
        <section class="bg-white p-5 rounded-2xl border border-amber-100 shadow-sm space-y-4">
            <div class="flex items-center justify-between border-b border-amber-100 pb-3">
                <h2 class="font-bold text-stone-800 flex items-center gap-2 text-base sm:text-lg">
                    1. Data Pesanan Belum Kirim
                </h2>
                <div class="flex items-center gap-2">
                    <button onclick="addBelumKirimGroup()" class="bg-amber-50 hover:bg-amber-100 text-amber-900 border border-amber-300 font-bold px-3.5 py-2 rounded-lg text-xs sm:text-sm transition-all">
                        + E-Commerce Baru
                    </button>
                </div>
            </div>

            <div id="belumKirimContainer" class="space-y-6">
                <!-- Form Grup Belum Kirim akan dirender secara dinamis -->
            </div>
        </section>

        <!-- Pengaturan GitHub Token & Repo -->
        <div class="bg-white p-5 rounded-2xl border border-amber-100 shadow-sm space-y-4">
            <div class="flex items-center justify-between border-b border-amber-100 pb-3">
                <h2 class="font-bold text-stone-800 flex items-center gap-2 text-sm sm:text-base">
                    🔑 Pengaturan Kunci Akses (GitHub Token)
                </h2>
                <span id="configStatus" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-red-100 text-red-700">Belum Terhubung</span>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Username GitHub:</label>
                    <input type="text" id="ghUsername" placeholder="Contoh: putradwi-dev" class="w-full bg-[#fdfbf7] border border-amber-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">Nama Repository:</label>
                    <input type="text" id="ghRepo" placeholder="Contoh: dashboard-mbp" class="w-full bg-[#fdfbf7] border border-amber-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-stone-600 mb-1">GitHub Personal Access Token (PAT):</label>
                    <input type="password" id="ghToken" placeholder="ghp_xxxxxxxxxxxx" class="w-full bg-[#fdfbf7] border border-amber-200 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-amber-800 focus:outline-none">
                </div>
            </div>
            <div class="flex justify-between items-center pt-1">
                <p class="text-[11px] text-stone-400">*Token ini disimpan dengan aman di penyimpanan lokal browser HP/Laptop Anda saja.</p>
                <button onclick="saveConfig()" class="bg-stone-800 hover:bg-stone-900 text-white font-bold px-4 py-2 rounded-lg text-xs sm:text-sm transition-all shadow-sm">
                    💾 Simpan Pengaturan Token
                </button>
            </div>
        </div>
    </main>

    <!-- Global State Data -->
    <script>
        let currentData = {
            belum_kirim: [],
            stok_tangerang: []
        };
        let currentSha = "";

        const STORE_OPTIONS = [
            "TOKOPEDIA MT",
            "TOKOPEDIA ADT",
            "SHOPE MT",
            "SHOPE ADT",
            "SHOPE TANGSEL",
            "OFFLINE"
        ];

        window.onload = function() {
            document.getElementById('ghUsername').value = localStorage.getItem('mbp_gh_user') || '';
            document.getElementById('ghRepo').value = localStorage.getItem('mbp_gh_repo') || '';
            document.getElementById('ghToken').value = localStorage.getItem('mbp_gh_token') || '';
            
            checkConfigStatus();
            if (localStorage.getItem('mbp_gh_token')) {
                loadFromGitHub();
            }
        };

        function saveConfig() {
            localStorage.setItem('mbp_gh_user', document.getElementById('ghUsername').value.trim());
            localStorage.setItem('mbp_gh_repo', document.getElementById('ghRepo').value.trim());
            localStorage.setItem('mbp_gh_token', document.getElementById('ghToken').value.trim());
            checkConfigStatus();
            alert('✓ Pengaturan Token berhasil disimpan di browser!');
            loadFromGitHub();
        }

        function checkConfigStatus() {
            const token = localStorage.getItem('mbp_gh_token');
            const user = localStorage.getItem('mbp_gh_user');
            const repo = localStorage.getItem('mbp_gh_repo');
            const statusEl = document.getElementById('configStatus');

            if (token && user && repo) {
                statusEl.innerText = "✓ Kunci Akses Dikonfigurasi";
                statusEl.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800";
            } else {
                statusEl.innerText = "⚠️ Belum Terhubung";
                statusEl.className = "text-xs font-semibold px-2.5 py-0.5 rounded-full bg-red-100 text-red-700";
            }
        }

        async function loadFromGitHub() {
            const user = localStorage.getItem('mbp_gh_user');
            const repo = localStorage.getItem('mbp_gh_repo');
            const token = localStorage.getItem('mbp_gh_token');

            if (!user || !repo || !token) {
                alert('Silakan lengkapi dan simpan Pengaturan Token terlebih dahulu.');
                return;
            }

            try {
                const url = `https://api.github.com/repos/${user}/${repo}/contents/data.json`;
                const response = await fetch(url, {
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                });

                if (!response.ok) throw new Error("Gagal mengambil data dari GitHub.");

                const resData = await response.json();
                currentSha = resData.sha;
                
                const jsonText = decodeURIComponent(escape(atob(resData.content)));
                currentData = JSON.parse(jsonText);

                renderAllForms();
            } catch (err) {
                alert(err.message);
            }
        }

        function renderAllForms() {
            renderBelumKirim();
            checkDuplicates();
        }

        function filterData() {
            renderBelumKirim();
        }

        function parseGroupName(fullGrup) {
            if (!fullGrup) return { store: "TOKOPEDIA MT", dateStr: new Date().toISOString().slice(0, 10) };
            
            let foundStore = STORE_OPTIONS.find(s => fullGrup.toUpperCase().startsWith(s));
            if (!foundStore) {
                return { store: STORE_OPTIONS[0], dateStr: new Date().toISOString().slice(0, 10) };
            }

            let remainder = fullGrup.substring(foundStore.length).trim();
            let dateStr = new Date().toISOString().slice(0, 10);

            if (remainder) {
                let parts = remainder.split('/');
                if (parts.length === 3) {
                    let d = parts[0].padStart(2, '0');
                    let m = parts[1].padStart(2, '0');
                    let y = parts[2];
                    dateStr = `${y}-${m}-${d}`;
                }
            }
            return { store: foundStore, dateStr };
        }

        function updateGroupComposite(gIdx) {
            const storeSelect = document.getElementById(`store_select_${gIdx}`);
            const dateInput = document.getElementById(`date_input_${gIdx}`);
            if (!storeSelect || !dateInput) return;

            let storeName = storeSelect.value;
            let dateVal = dateInput.value;

            if (dateVal) {
                let parts = dateVal.split('-');
                if (parts.length === 3) {
                    let formattedDate = `${parseInt(parts[2])}/${parseInt(parts[1])}/${parts[0]}`;
                    currentData.belum_kirim[gIdx].grup = `${storeName} ${formattedDate}`;
                    renderBelumKirim();
                    return;
                }
            }
            currentData.belum_kirim[gIdx].grup = storeName;
            renderBelumKirim();
        }

        // Fungsi baru untuk mengubah tanggal secara massal langsung dari header pemisah
        function updateAllGroupsDate(oldDateStr, newDateVal) {
            if (!newDateVal) return;
            let parts = newDateVal.split('-'); // Format YYYY-MM-DD
            if (parts.length !== 3) return;
            let formattedNewDate = `${parseInt(parts[2])}/${parseInt(parts[1])}/${parts[0]}`;

            currentData.belum_kirim.forEach(group => {
                let parsed = parseGroupName(group.grup);
                let matchDate = (group.grup || '').match(/(\d{1,2}\/\d{1,2}\/\d{4})/);
                if (matchDate && matchDate[1] === oldDateStr) {
                    group.grup = `${parsed.store} ${formattedNewDate}`;
                }
            });
            renderBelumKirim();
        }

        function extractDateFromGroup(grupStr) {
            const match = (grupStr || '').match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
            if (match) {
                const [, d, m, y] = match;
                return new Date(`${y}-${m.padStart(2, '0')}-${d.padStart(2, '0')}`).getTime();
            }
            return 0;
        }

        function moveGroupInSameDate(sortedIdx, direction) {
            const groups = currentData.belum_kirim || [];
            const sorted = groups.map((g, originalIndex) => ({ g, originalIndex })).sort((a, b) => {
                const diff = extractDateFromGroup(a.g.grup) - extractDateFromGroup(b.g.grup);
                return diff !== 0 ? diff : a.originalIndex - b.originalIndex;
            });

            const targetSortedIdx = sortedIdx + direction;
            if (targetSortedIdx < 0 || targetSortedIdx >= sorted.length) return;

            const currentItem = sorted[sortedIdx];
            const targetItem = sorted[targetSortedIdx];

            if (extractDateFromGroup(currentItem.g.grup) !== extractDateFromGroup(targetItem.g.grup)) return;

            sorted[sortedIdx] = targetItem;
            sorted[targetSortedIdx] = currentItem;

            currentData.belum_kirim = sorted.map(item => item.g);
            renderBelumKirim();
        }

        function renderBelumKirim() {
            const container = document.getElementById('belumKirimContainer');
            container.innerHTML = '';

            const groups = currentData.belum_kirim || [];
            if (groups.length === 0) return;

            const sortedGroups = groups.map((g, originalIndex) => ({ g, originalIndex })).sort((a, b) => {
                const diff = extractDateFromGroup(a.g.grup) - extractDateFromGroup(b.g.grup);
                return diff !== 0 ? diff : a.originalIndex - b.originalIndex;
            });

            const keyword = (document.getElementById('searchInput') ? document.getElementById('searchInput').value : '').toLowerCase().trim();
            let lastDateStr = '';

            sortedGroups.forEach(({ g: group, originalIndex: gIdx }, sortedIdx) => {
                const dateMatch = (group.grup || '').match(/(\d{1,2}\/\d{1,2}\/\d{4})/);
                const currentDateStr = dateMatch ? dateMatch[1] : '';

                if (currentDateStr && currentDateStr !== lastDateStr) {
                    lastDateStr = currentDateStr;

                    // Konversi format tanggal DD/MM/YYYY ke YYYY-MM-DD untuk input date HTML
                    let p = currentDateStr.split('/');
                    let isoDate = p.length === 3 ? `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}` : '';

                    const dateDivider = document.createElement('div');
                    dateDivider.className = "flex items-center gap-4 pt-4 pb-2 mb-2 date-section-divider";
                    dateDivider.innerHTML = `
                        <div class="flex items-center gap-2 bg-stone-900 text-amber-50 px-3.5 py-2 rounded-xl shadow-sm text-sm sm:text-base font-extrabold tracking-wide uppercase border border-amber-500/30">
                            <span>📅 Tanggal Pesanan Masuk:</span>
                            <input type="date" value="${isoDate}" onchange="updateAllGroupsDate('${currentDateStr}', this.value)" class="bg-stone-800 text-amber-200 border border-amber-500/40 rounded px-2 py-1 text-xs sm:text-sm font-bold focus:outline-none focus:ring-1 focus:ring-amber-400 cursor-pointer" title="Klik untuk mengubah tanggal kelompok ini">
                        </div>
                        <div class="flex-grow border-t-2 border-stone-300"></div>
                    `;
                    container.appendChild(dateDivider);
                }

                let itemsHtml = '';
                let hasVisibleItem = false;

                (group.items || []).forEach((item, iIdx) => {
                    item.kayu = !!item.kayu;
                    item.terlambat = !!item.terlambat;
                    item.batal = !!item.batal;
                    item.catatan_manual = item.catatan_manual || '';
                    item.potong_stok = !!item.potong_stok;

                    const namaBarang = (item.nama || '').toLowerCase();
                    const noPesanan = (item.no_pesanan || '').toLowerCase();
                    const namaGrup = (group.grup || '').toLowerCase();
                    const catatanManualStr = item.catatan_manual.toLowerCase();

                    const isMatch = keyword === '' || namaBarang.includes(keyword) || noPesanan.includes(keyword) || namaGrup.includes(keyword) || catatanManualStr.includes(keyword);

                    if (isMatch) {
                        hasVisibleItem = true;
                    }

                    const displayStyle = isMatch ? '' : 'display: none;';
                    itemsHtml += `
                        <div class="space-y-1.5 bg-white p-3.5 rounded-xl border border-amber-100 shadow-sm item-row-admin" data-gidx="${gIdx}" data-iidx="${iIdx}" style="${displayStyle}">
                            <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-center">
                                <div class="sm:col-span-3">
                                    <label class="block text-[11px] text-stone-400 font-bold uppercase sm:hidden mb-1">Nama Barang</label>
                                    <input type="text" value="${item.nama || ''}" onchange="updateItemNameWithStokCheck(${gIdx}, ${iIdx}, this.value)" placeholder="Nama Barang" class="w-full bg-[#faf7f2] border border-stone-200 rounded-lg px-3 py-2 text-sm sm:text-base font-bold text-stone-800 focus:ring-2 focus:ring-amber-800 focus:outline-none">
                                </div>
                                <div class="sm:col-span-1">
                                    <label class="block text-[11px] text-stone-400 font-bold uppercase sm:hidden mb-1">QTY</label>
                                    <input type="number" min="1" value="${item.qty !== undefined ? item.qty : 1}" onchange="updateItemQty(${gIdx}, ${iIdx}, this.value)" placeholder="Qty" class="w-full bg-[#faf7f2] border border-stone-200 rounded-lg px-2 py-2 text-sm sm:text-base font-extrabold text-center text-stone-900 focus:ring-2 focus:ring-amber-800 focus:outline-none">
                                </div>
                                <div class="sm:col-span-3">
                                    <label class="block text-[11px] text-stone-400 font-bold uppercase sm:hidden mb-1">No. Pesanan</label>
                                    <input type="text" id="no_pesanan_${gIdx}_${iIdx}" value="${item.no_pesanan || ''}" oninput="updateItemNo(${gIdx}, ${iIdx}, this.value)" placeholder="Nomor Pesanan" class="w-full bg-[#faf7f2] border border-stone-200 rounded-lg px-3 py-2 text-sm sm:text-base font-mono font-bold text-stone-800 focus:ring-2 focus:ring-amber-800 focus:outline-none">
                                </div>
                                <div class="sm:col-span-1">
                                    <label class="block text-[11px] text-stone-400 font-bold uppercase sm:hidden mb-1">Ekspedisi</label>
                                    <select onchange="updateItemExp(${gIdx}, ${iIdx}, this.value)" class="w-full bg-[#faf7f2] border border-stone-200 rounded-lg px-2 py-2 text-xs sm:text-sm font-extrabold text-stone-900 cursor-pointer focus:ring-2 focus:ring-amber-800 focus:outline-none">
                                        <option value="JNE" ${item.ekspedisi === 'JNE' ? 'selected' : ''}>JNE</option>
                                        <option value="J&T" ${item.ekspedisi === 'J&T' ? 'selected' : ''}>J&T</option>
                                        <option value="KURIR TOKO" ${item.ekspedisi === 'KURIR TOKO' ? 'selected' : ''}>KURIR TOKO</option>
                                        <option value="EKS. LAINNYA" ${(!['JNE','J&T','SICEPAT','KURIR TOKO'].includes(item.ekspedisi)) ? 'selected' : ''}>Lainnya</option>
                                    </select>
                                </div>
                                <div class="sm:col-span-3 flex flex-col gap-1.5 bg-[#faf7f2] px-2.5 py-2 rounded-lg border border-stone-200">
                                    <div class="flex flex-wrap items-center justify-center gap-2">
                                        <label class="flex items-center gap-0.5 text-[11px] font-bold text-stone-800 cursor-pointer">
                                            <input type="checkbox" ${item.kayu ? 'checked' : ''} onclick="updateItemStatusCheckbox(${gIdx}, ${iIdx}, 'kayu', this.checked)" class="w-3.5 h-3.5 rounded text-amber-800 focus:ring-amber-700"> Kayu
                                        </label>
                                        <label class="flex items-center gap-0.5 text-[11px] font-bold text-red-700 cursor-pointer">
                                            <input type="checkbox" ${item.terlambat ? 'checked' : ''} onclick="updateItemStatusCheckbox(${gIdx}, ${iIdx}, 'terlambat', this.checked)" class="w-3.5 h-3.5 rounded text-red-600 focus:ring-red-600"> Terlambat
                                        </label>
                                        <label class="flex items-center gap-0.5 text-[11px] font-bold text-orange-700 cursor-pointer" title="Malam Ini Batal">
                                            <input type="checkbox" ${item.batal ? 'checked' : ''} onclick="updateItemStatusCheckbox(${gIdx}, ${iIdx}, 'batal', this.checked)" class="w-3.5 h-3.5 rounded text-orange-600 focus:ring-orange-600"> MIB
                                        </label>
                                    </div>
                                    <input type="text" value="${item.catatan_manual}" onchange="updateItemCatatanManual(${gIdx}, ${iIdx}, this.value)" placeholder="Catatan manual khusus..." class="w-full bg-white border border-stone-300 rounded px-2 py-1 text-xs text-stone-800 focus:ring-1 focus:ring-amber-800 focus:outline-none">
                                </div>
                                <div class="sm:col-span-1 text-center">
                                    <button onclick="confirmDeleteBelumKirimItem(${gIdx}, ${iIdx})" class="bg-red-50 hover:bg-red-100 text-red-600 hover:text-red-800 text-xs sm:text-sm font-bold px-2 py-2 rounded-lg border border-red-200 transition-all w-full shadow-sm">Hapus</button>
                                </div>
                            </div>
                        </div>
                    `;
                });

                if (keyword !== '' && !hasVisibleItem) return;

                const parsed = parseGroupName(group.grup);
                let storeOptionsHtml = STORE_OPTIONS.map(opt => `<option value="${opt}" ${parsed.store === opt ? 'selected' : ''}>${opt}</option>`).join('');

                const currentTime = extractDateFromGroup(group.grup);
                const canMoveUp = sortedIdx > 0 && extractDateFromGroup(sortedGroups[sortedIdx - 1].g.grup) === currentTime;
                const canMoveDown = sortedIdx < sortedGroups.length - 1 && extractDateFromGroup(sortedGroups[sortedIdx + 1].g.grup) === currentTime;

                let moveButtons = '';
                if (canMoveUp || canMoveDown) {
                    moveButtons = `<div class="flex items-center gap-1.5 border-l border-amber-200 pl-2.5 ml-1">`;
                    if (canMoveUp) {
                        moveButtons += `<button onclick="moveGroupInSameDate(${sortedIdx}, -1)" class="bg-stone-200 hover:bg-stone-300 text-stone-800 font-bold px-2.5 py-1.5 rounded-lg text-xs transition-all" title="Geser toko ke atas">Geser ke Atas</button>`;
                    }
                    if (canMoveDown) {
                        moveButtons += `<button onclick="moveGroupInSameDate(${sortedIdx}, 1)" class="bg-stone-200 hover:bg-stone-300 text-stone-800 font-bold px-2.5 py-1.5 rounded-lg text-xs transition-all" title="Geser toko ke bawah">Geser ke Bawah</button>`;
                    }
                    moveButtons += `</div>`;
                }

                let gDiv = document.createElement('div');
                gDiv.className = "bg-white p-4 sm:p-5 rounded-2xl border-2 border-stone-900 shadow-sm space-y-4 mb-6";

                gDiv.innerHTML = `
                    <div class="flex flex-wrap items-center justify-between pb-2 border-b border-amber-200/60 gap-2">
                        <div class="flex items-center gap-2 flex-wrap">
                            <span class="w-3.5 h-3.5 rounded-full bg-amber-700"></span>
                            <select id="store_select_${gIdx}" onchange="updateGroupComposite(${gIdx})" class="font-bold text-amber-950 text-sm sm:text-base bg-white border border-amber-200 rounded-lg px-3 py-1.5 uppercase tracking-wide focus:ring-2 focus:ring-amber-800 focus:outline-none cursor-pointer">
                                ${storeOptionsHtml}
                            </select>
                            <input type="date" id="date_input_${gIdx}" value="${parsed.dateStr}" onchange="updateGroupComposite(${gIdx})" class="font-semibold text-stone-800 text-sm bg-white border border-amber-200 rounded-lg px-2.5 py-1.5 focus:ring-2 focus:ring-amber-800 focus:outline-none cursor-pointer">
                            ${moveButtons}
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="addBelumKirimItem(${gIdx})" class="bg-amber-800 text-white font-bold px-3 py-1.5 rounded-lg text-xs sm:text-sm hover:bg-amber-900 transition-all">+ Pesanan</button>
                            <button onclick="confirmDeleteGroup(${gIdx})" class="bg-red-100 text-red-700 font-bold px-2.5 py-1.5 rounded-lg text-xs sm:text-sm hover:bg-red-200 transition-all">Hapus E-Commerce</button>
                        </div>
                    </div>
                    <div class="space-y-2.5">
                        ${itemsHtml}
                    </div>
                `;

                container.appendChild(gDiv);
            });
            checkDuplicates();
        }

        function updateItemName(gIdx, iIdx, val) { 
            currentData.belum_kirim[gIdx].items[iIdx].nama = val; 
        }

        function updateItemNameWithStokCheck(gIdx, iIdx, val) {
            updateItemName(gIdx, iIdx, val);

            const item = currentData.belum_kirim[gIdx].items[iIdx];
            const qtyOrder = item.qty || 1;
            const matchedStok = findStokTitipanMatch(val);

            if (matchedStok && !item.potong_stok) {
                setTimeout(() => {
                    const confirmKurang = confirm(
                        `⚠️ PENGINGAT STOK TITIPAN:\n\n` +
                        `Barang "${val}" terdeteksi ada di Stok Titipan Gudang ("${matchedStok.nama}" dengan sisa stok: ${matchedStok.jumlah}).\n\n` +
                        `Apakah Anda ingin otomatis memotong Stok Titipan sebanyak ${qtyOrder} item?`
                    );

                    if (confirmKurang) {
                        kurangiStokTitipanOtomatis(gIdx, iIdx, matchedStok.nama, qtyOrder);
                    } else {
                        renderAllForms();
                    }
                }, 100);
            } else {
                renderAllForms();
            }
        }

        function updateItemQty(gIdx, iIdx, val) { 
            currentData.belum_kirim[gIdx].items[iIdx].qty = Number(val) || 1; 
            renderBelumKirim();
        }

        function updateItemNo(gIdx, iIdx, val) { 
            currentData.belum_kirim[gIdx].items[iIdx].no_pesanan = val; 
            checkDuplicates();
        }

        function updateItemExp(gIdx, iIdx, val) { currentData.belum_kirim[gIdx].items[iIdx].ekspedisi = val; }
        
        function updateItemStatusCheckbox(gIdx, iIdx, field, isChecked) {
            currentData.belum_kirim[gIdx].items[iIdx][field] = isChecked;
        }

        function updateItemCatatanManual(gIdx, iIdx, val) {
            currentData.belum_kirim[gIdx].items[iIdx].catatan_manual = val;
        }

        function checkDuplicates() {
            const counts = {};
            (currentData.belum_kirim || []).forEach(group => {
                (group.items || []).forEach(item => {
                    const no = (item.no_pesanan || '').trim();
                    if (no !== '') {
                        counts[no] = (counts[no] || 0) + 1;
                    }
                });
            });

            let hasDuplicate = false;
            (currentData.belum_kirim || []).forEach((group, gIdx) => {
                (group.items || []).forEach((item, iIdx) => {
                    const no = (item.no_pesanan || '').trim();
                    const inputEl = document.getElementById(`no_pesanan_${gIdx}_${iIdx}`);
                    if (inputEl) {
                        if (no !== '' && counts[no] > 1) {
                            inputEl.classList.add('border-red-500', 'bg-red-50', 'text-red-700');
                            inputEl.title = "Nomor pesanan ini duplikat!";
                            hasDuplicate = true;
                        } else {
                            inputEl.classList.remove('border-red-500', 'bg-red-50', 'text-red-700');
                            inputEl.title = "";
                        }
                    }
                });
            });

            const warningBanner = document.getElementById('globalDuplicateWarning');
            if (warningBanner) {
                if (hasDuplicate) {
                    warningBanner.classList.remove('hidden');
                } else {
                    warningBanner.classList.add('hidden');
                }
            }
        }
        
        function addBelumKirimGroup() {
            if (!currentData.belum_kirim) currentData.belum_kirim = [];
            let today = new Date();
            let d = today.getDate();
            let m = today.getMonth() + 1;
            let y = today.getFullYear();

            currentData.belum_kirim.push({ 
                grup: `TOKOPEDIA MT ${d}/${m}/${y}`, 
                items: [
                    { nama: "", qty: 1, no_pesanan: "", ekspedisi: "JNE", kayu: false, terlambat: false, batal: false, catatan_manual: "", potong_stok: false }
                ] 
            });
            renderBelumKirim();
        }

        function addBelumKirimItem(gIdx) {
            if (!currentData.belum_kirim[gIdx].items) currentData.belum_kirim[gIdx].items = [];
            currentData.belum_kirim[gIdx].items.push({ nama: "", qty: 1, no_pesanan: "", ekspedisi: "JNE", kayu: false, terlambat: false, batal: false, catatan_manual: "", potong_stok: false });
            renderBelumKirim();
        }

        function confirmDeleteBelumKirimItem(gIdx, iIdx) {
            if (confirm("Yakin ingin menghapus item pesanan ini?")) {
                currentData.belum_kirim[gIdx].items.splice(iIdx, 1);
                renderBelumKirim();
            }
        }

        function confirmDeleteGroup(gIdx) {
            if (confirm("⚠️ Yakin ingin menghapus seluruh kelompok E-Commerce ini beserta isinya?")) {
                currentData.belum_kirim.splice(gIdx, 1);
                renderBelumKirim();
            }
        }

        async function saveToGitHub() {
            const user = localStorage.getItem('mbp_gh_user');
            const repo = localStorage.getItem('mbp_gh_repo');
            const token = localStorage.getItem('mbp_gh_token');

            if (!user || !repo || !token) {
                alert('Pengaturan token belum lengkap!');
                return;
            }

            try {
                const url = `https://api.github.com/repos/${user}/${repo}/contents/data.json`;

                // Ambil data.json & SHA terbaru terlebih dahulu agar stok titipan & ceklis konfirmasi karyawan tidak tertimpa
                const latestRes = await fetch(url, {
                    headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' },
                    cache: 'no-store'
                });
                if (!latestRes.ok) throw new Error("Gagal sinkronisasi data terbaru dari GitHub.");
                const latestMeta = await latestRes.json();
                const latestJson = JSON.parse(decodeURIComponent(escape(atob(latestMeta.content))));

                // Pertahankan status ceklis konfirmasi terbaru dari server untuk pesanan yang sama
                const serverConfirmMap = {};
                (latestJson.belum_kirim || []).forEach(g => {
                    (g.items || []).forEach(it => {
                        if (it.no_pesanan) {
                            serverConfirmMap[it.no_pesanan.trim()] = it;
                        }
                    });
                });

                (currentData.belum_kirim || []).forEach(g => {
                    (g.items || []).forEach(it => {
                        const key = (it.no_pesanan || '').trim();
                        if (key && serverConfirmMap[key]) {
                            const srv = serverConfirmMap[key];
                            if (srv.siap_kirim !== undefined) it.siap_kirim = srv.siap_kirim;
                            if (srv.konfirmasi !== undefined) it.konfirmasi = srv.konfirmasi;
                            if (srv.checked !== undefined) it.checked = srv.checked;
                        }
                    });
                });

                // Hanya update bagian belum_kirim; biarkan stok_tangerang tetap mengikuti data terbaru di GitHub
                latestJson.belum_kirim = currentData.belum_kirim;
                currentData = latestJson;

                const jsonString = JSON.stringify(latestJson, null, 2);
                const contentBase64 = btoa(unescape(encodeURIComponent(jsonString)));

                const bodyData = {
                    message: "Update data pesanan belum_kirim dari admin utama",
                    content: contentBase64,
                    sha: latestMeta.sha
                };

                const response = await fetch(url, {
                    method: 'PUT',
                    headers: {
                        'Authorization': `token ${token}`,
                        'Content-Type': 'application/json',
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify(bodyData)
                });

                if (!response.ok) throw new Error("Gagal menyimpan ke GitHub.");

                const resJson = await response.json();
                currentSha = resJson.content.sha;

                alert("BERHASIL SIMPAN & UPDATE");
            } catch (err) {
                alert("Gagal menyimpan: " + err.message);
            }
        }
    </script>
